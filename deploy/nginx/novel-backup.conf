# novel-backup 用 nginx 設定のサンプル
#
# 使い方:
#   1. novel.kuropengin.com を実際のドメインに置き換える(3 か所)
#   2. ~/docker/proxy/config/conf.d/ にコピーする
#   3. docker compose -f ~/docker/proxy/docker-compose.yml exec proxy nginx -t
#   4. docker compose -f ~/docker/proxy/docker-compose.yml exec proxy nginx -s reload
#
# 前提: nginx コンテナと novel-backup コンテナが同じネットワーク proxy_web に参加していること

server {
    server_name novel.kuropengin.com;

    # Docker 内蔵 DNS で都度解決する(novel-backup が停止していても nginx が起動できるように)
    resolver 127.0.0.11 valid=30s;
    set $novel_backup http://novel-backup:3000;

    # API の本文は小さい(アプリ側でも認証系 16kb / その他 256kb に制限)
    client_max_body_size 512k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 接続元 IP はログイン回数制限に使う。追記($proxy_add_x_forwarded_for)ではなく上書きする
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 進捗 SSE。バッファリングを切り、長時間接続を許す
    location /api/backup/progress {
        proxy_pass $novel_backup;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $novel_backup;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    include conf.d/common/ssl-key.conf;
}

server {
    if ($host = novel.kuropengin.com) {
        return 301 https://$host$request_uri;
    }

    server_name novel.kuropengin.com;

    listen 80;
    return 404;
}
